name: Publish deliverables site

on:
  push:
    branches: [main]
    paths:
      - 'D2-gap-analysis-benchmark-survey/**'
      - 'scripts/site/**'
      - '.github/workflows/site-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install TeX (PDF engine)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            texlive-xetex texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended lmodern

      - name: Build site (HTML and PDF)
        run: bash scripts/site/build.sh

      # Plain git instead of a third-party action. Keeps live PR previews.
      - name: Deploy to gh-pages
        run: |
          git clone --quiet --branch gh-pages --single-branch \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
          rsync -a --delete --exclude 'pr-preview/' --exclude '.git/' _site/ gh-pages/
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes to publish"; exit 0; }
          git commit --quiet -m "Publish deliverables site from ${GITHUB_SHA::7}"
          git push --quiet origin gh-pages
